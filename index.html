
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>FiveM Background Player</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
        }

        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>
    <iframe
        src="https://www.youtube.com/embed/9tgVcKxZCnk?autoplay=1&mute=1&loop=1&playlist=9tgVcKxZCnk&controls=0"
        allow="autoplay; encrypted-media"
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
</body>
</html>
